<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujwal Choudhary | SOC Analyst</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #f5f7f9;
            color: #18222d;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px 25px;
        }
        .shield {
            width: 70px;
            height: 70px;
            margin: 0 auto 30px;
            border: 2px solid #1d5c63;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        h1 {
            font-size: 38px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .role {
            color: #1d5c63;
            font-size: 16px;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }
        .description {
            color: #65717c;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 35px;
        }
        .status {
            color: #3b765b;
            font-size: 13px;
            margin-bottom: 30px;
        }
        .enter-btn {
            display: inline-block;
            padding: 13px 35px;
            background: #1d5c63;
            color: white;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .enter-btn:hover {
            background: #16494f;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }
            .role {
                font-size: 13px;
            }
            .description {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="shield">
            🛡️
        </div>
        <h1>
            UJWAL CHOUDHARY
        </h1>
        <div class="role">
            SOC ANALYST
        </div>
        <p class="description">
            Cybersecurity • SIEM • Log Analysis • Threat Detection
        </p>
        <div class="status">
            ● JOINING ROOTSECURED CONSULTANT PVT. LTD. — 17 AUG 2026
        </div>
        <a href="dashboard.html" class="enter-btn">
            ENTER PORTFOLIO
        </a>
    </div>
</body>
</html>
